<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>手語教學平台</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0; padding: 0;
    background-color: #f0f0f0;
  }
  nav {
    display: flex;
    justify-content: flex-end;
    background-color: transparent; /* 改成透明 */
    padding: 10px 20px;
    position: relative;
    align-items: center; /* 置中垂直對齊 */
  }
  nav button {
    background-color: transparent; /* 透明底 */
    color: black; /* 黑字 */
    /* border: 1.5px solid black; 改為無邊框 */
    border: none;
    padding: 8px 16px;
    margin-left: 10px;
    border-radius: 9999px; /* 超圓潤 */
    cursor: pointer;
    font-size: 1em;
    transition: all 0.3s ease;
  }
  nav button:hover {
    background-color: black; /* 滑鼠懸浮變黑底 */
    color: white; /* 字變白 */
  }
  #user-menu-button {
    background: transparent;
    color: black;
    /* border: 1.5px solid black; 改為無邊框 */
    border: none;
    font-size: 1em;
    cursor: pointer;
    margin-left: 10px;
    padding: 8px 16px;
    border-radius: 9999px; /* 超圓潤 */
    position: relative;
    transition: all 0.3s ease;
  }
  #user-menu-button:hover {
    background-color: black;
    color: white;
  }
  #user-menu {
    display: none;
    position: absolute;
    top: 45px;
    right: 20px;
    background-color: white;
    border-radius: 5px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    z-index: 20;
  }
  #user-menu a, #user-menu button {
    display: block;
    padding: 10px 20px;
    color: #333;
    text-decoration: none;
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    cursor: pointer;
    font-size: 1em;
  }
  #user-menu a:hover, #user-menu button:hover {
    background-color: #eee;
  }

  /* 漢堡選單按鈕 */
   /* === 改良後的漢堡選單按鈕 === */
  #hamburger-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    width: 40px;
    height: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin-right: auto; /* 靠左 */
    border-radius: 8px;
    transition: background-color 0.3s ease;
  }

  #hamburger-btn:hover {
    background-color: rgba(0,0,0,0.1);
  }

  #hamburger-btn div {
    width: 24px;
    height: 3px;
    background-color: black;
    border-radius: 2px;
    margin: 3px 0; /* 讓三條線分開 */
    transition: all 0.3s ease;
  }

  /* 搜尋欄 */
  #search-form {
    margin-left: 20px;
    display: flex;
    align-items: center;
  }
  #search-input {
    padding: 6px 10px;
    font-size: 1em;
    /* border: 1.5px solid black; 改為無邊框 */
    border: none;
    border-radius: 9999px 0 0 9999px; /* 左側超圓潤 */
    outline: none;
  }
  #search-btn {
    padding: 8px 14px;
    font-size: 1em;
    /* border: 1.5px solid black; border-left: none; 改為無邊框 */
    border: none;
    border-radius: 0 9999px 9999px 0; /* 右側超圓潤 */
    background-color: transparent;
    color: black;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  #search-btn:hover {
    background-color: black;
    color: white;
  }

    /* ===== modal / overlay ===== */
  #modal-overlay {
    display: none; /* 預設隱藏 */
    position: fixed;
    inset: 0; /* top:0; right:0; bottom:0; left:0 */
    background: rgba(0,0,0,0.45);
    z-index: 60;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  #user-modal {
    width: 420px;           /* 模塊較大 */
    max-width: 95%;
    background: #fff;
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    text-align: center;
  }

  #user-modal h2 {
    margin: 0 0 8px 0;
    font-size: 1.25rem;
  }

  #user-modal p { color: #333; margin-bottom: 12px; }

  #user-modal a#account-link {
    display: block;
    width: 70%;
    margin: 10px auto;
    padding: 12px 10px;
    background: #eee;
    border-radius: 10px;
    text-decoration: none;
    color: #111;
    font-weight: 500;
  }

  #user-modal #logout-btn {
    display: block;
    width: 60%;
    margin: 12px auto 0 auto; /* 置中 */
    padding: 12px 10px;
    background: #f55;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1rem;
  }

  #user-modal #logout-btn:hover { background: #d33; }

  #user-modal #close-modal {
    display: inline-block;
    margin-top: 12px;
    background: transparent;
    border: none;
    color: #666;
    cursor: pointer;
  }

  
  /* 滑出側邊表單 */
  #side-form {
    position: fixed;
    top: 0;
    left: -320px; /* 初始隱藏在左邊 */
    width: 280px;
    height: 100vh;
    background-color: white;
    box-shadow: 2px 0 8px rgba(0,0,0,0.3);
    z-index: 30;
    transition: left 0.35s ease;
    display: flex;
    flex-direction: column;
    padding: 20px;
  }
  #side-form.active {
    left: 0;
  }
  #side-form button, #side-form a {
    margin-bottom: 15px;
    padding: 10px 15px;
    font-size: 1em;
    text-align: left;
    color: black;
    background: #eee;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    text-decoration: none;
    user-select: none;
    transition: background-color 0.3s ease;
  }
  #side-form button:hover, #side-form a:hover {
    background-color: #ccc;
  }

.video-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr); /* 三欄 */
  gap: 20px; /* 影片間距 */
  padding: 20px;
  justify-items: center;
}

.video-item {
  width: 100%;
  max-width: 360px; /* 控制每個影片寬度 */
  background-color: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  text-align: center;
}

.video-item iframe {
  width: 100%;
  height: 200px;
  display: block;
}

.video-title {
  padding: 10px;
  font-size: 1em;
  background-color: #f9f9f9;
}

.video-mask {
  display: none !important;
}

</style>
</head>
<body>

<nav>
  <button id="hamburger-btn" aria-label="開啟選單">
    <div></div>
    <div></div>
    <div></div>
  </button>

  <form id="search-form" action="/search" method="GET" role="search" >
    <input id="search-input" type="text" name="q" placeholder="搜尋影片或課程" aria-label="搜尋" required />
    <button id="search-btn" type="submit">搜尋</button>
  </form>

  <a href="/login" id="login-btn"><button type="button">登入</button></a>
  <a href="/register" id="register-btn"><button type="button">註冊</button></a>

  <button id="user-menu-button" style="display:none;"></button>
    <!-- Modal 與遮罩 -->
  <div id="modal-overlay" aria-hidden="true">
    <div id="user-modal" role="dialog" aria-modal="true" aria-labelledby="user-modal-title">
      <h2 id="user-modal-title">帳號管理</h2>

      <!-- 你可以放更多帳號資訊在這裡 -->
      <p id="user-name" style="margin:0 0 12px 0;">使用者：<span id="user-name-text"></span></p>

      <!-- 帳號管理連結 -->
      <a href="/account" id="account-link">進入帳號管理頁面</a>

      <!-- 登出表單（按鈕置中） -->
      <form id="logout-form" action="/logout" method="post" style="margin: 14px 0 0 0;">
        <button type="submit" id="logout-btn">登出</button>
      </form>

      <!-- 關閉按鈕 -->
      <button id="close-modal" type="button">關閉</button>
    </div>
  </div>

</nav>

<!-- 新增側邊出來表單 -->
<div id="side-form" aria-hidden="true">
  <a href="/account" tabindex="0">帳號管理頁面</a>
  <button type="button" id="favorites-btn" tabindex="0">收藏影片</button>
</div>

<section id="video-section">
  <div id="video-container" class="video-grid">
    <!-- 登入後才會顯示的影片 -->
  </div>
</section>

<script>
  window.loggedIn = {{ loggedIn|tojson }};
  window.username = {{ username|tojson }};
</script>

<script>
  const videoMask = document.getElementById('video-mask');
  const videoContainer = document.getElementById('video-container');
  const loginBtn = document.getElementById('login-btn');
  const registerBtn = document.getElementById('register-btn');
  const userMenuButton = document.getElementById('user-menu-button');
  const userMenu = document.getElementById('user-menu');
  const hamburgerBtn = document.getElementById('hamburger-btn');
  const sideForm = document.getElementById('side-form');

  window.onload = () => {
    const loggedIn = window.loggedIn || localStorage.getItem('loggedIn') === 'true';
    const username = window.username || localStorage.getItem('username') || '使用者';

    if (loggedIn) {
      videoMask.style.display = 'none'; // 隱藏遮罩

      // ======= 嵌入 18 部 YouTube 影片 =======
      const youtubeIDs = [
        'rboiHxBqdZk', '', '', '', '', '',
        '', '', '', '', '', '',
        '', '', '', '', '', ''
      ];
      const titles = [
        '名稱1', '名稱2', '名稱3',
        '名稱4', '名稱5', '名稱6',
        '名稱7', '名稱8', '名稱9',
        '名稱10', '名稱11', '名稱12',
        '名稱13', '名稱14', '名稱15',
        '名稱16', '名稱17', '名稱18'
      ];

      videoContainer.innerHTML = youtubeIDs.map((id, i) => `
        <div class="video-item">
          ${id 
            ? `<iframe src="https://www.youtube.com/embed/${id}" 
                      frameborder="0" allow="accelerometer; autoplay; 
                      clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                      allowfullscreen></iframe>`
            : `<div style="height:200px;display:flex;justify-content:center;align-items:center;background:#ccc;">尚未設定影片</div>`
          }
          <div class="video-title">${titles[i]}</div>
        </div>
      `).join('');

      // 顯示使用者名稱
      loginBtn.style.display = 'none';
      registerBtn.style.display = 'none';
      userMenuButton.style.display = 'inline-block';
      userMenuButton.textContent = username;
    } else {
      videoContainer.style.display = 'none';
      videoMask.style.display = 'flex';
      loginBtn.style.display = 'inline-block';
      registerBtn.style.display = 'inline-block';
      userMenuButton.style.display = 'none';
      userMenu.style.display = 'none';
    }
  }

    // 取得 modal 與相關元素
  const modalOverlay = document.getElementById('modal-overlay');
  const userModal = document.getElementById('user-modal');
  const closeModalBtn = document.getElementById('close-modal');
  const userNameText = document.getElementById('user-name-text');

  function openUserModal() {
    // 在 modal 顯示使用者名稱
    userNameText.textContent = (window.username && window.username !== '') ? window.username : '使用者';
    modalOverlay.style.display = 'flex';
    modalOverlay.setAttribute('aria-hidden', 'false');
    // 防止背景滾動（可選）
    document.body.style.overflow = 'hidden';
  }

  function closeUserModal() {
    modalOverlay.style.display = 'none';
    modalOverlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  // 當點擊使用者名稱時開啟 modal
  userMenuButton.addEventListener('click', (e) => {
    e.stopPropagation();
    openUserModal();
  });

  // 點遮罩背景或按關閉按鈕會關閉
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeUserModal();
  });
  closeModalBtn.addEventListener('click', closeUserModal);

  // 按 Esc 關閉
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeUserModal();
  });

  // （保留其他 document click 處理 sideForm 的邏輯 — 若你有原本偵測側邊欄的程式，請確保不要刪）


  document.addEventListener('click', (e) => {
    if (!userMenu.contains(e.target) && e.target !== userMenuButton) {
      userMenu.style.display = 'none';
    }
    if (!sideForm.contains(e.target) && e.target !== hamburgerBtn) {
      sideForm.classList.remove('active');
      sideForm.setAttribute('aria-hidden', 'true');
    }
  });

  hamburgerBtn.addEventListener('click', () => {
    const isActive = sideForm.classList.toggle('active');
    sideForm.setAttribute('aria-hidden', !isActive);
  });

  // 收藏影片按鈕點擊事件（可自行補充）
  const favoritesBtn = document.getElementById('favorites-btn');
  favoritesBtn.addEventListener('click', () => {
    alert('這裡可以實作收藏影片的功能');
  });
</script>

</body>
</html>
