<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>手語教學平台</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0; padding: 0;
    background-color: #f0f0f0;
  }
  nav {
    display: flex;
    justify-content: flex-end;
    background-color: #333;
    padding: 10px 20px;
    position: relative;
  }
  nav button {
    background-color: #0066cc;
    color: white;
    border: none;
    padding: 8px 16px;
    margin-left: 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 1em;
  }
  nav button:hover {
    background-color: #004999;
  }
  #user-menu-button {
    background: none;
    color: white;
    border: none;
    font-size: 1em;
    cursor: pointer;
    margin-left: 10px;
    padding: 8px 16px;
    border-radius: 5px;
    position: relative;
  }
  #user-menu-button:hover {
    background-color: #004999;
  }
  #user-menu {
    display: none;
    position: absolute;
    top: 45px;
    right: 20px;
    background-color: white;
    border-radius: 5px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    z-index: 10;
  }
  #user-menu a, #user-menu button {
    display: block;
    padding: 10px 20px;
    color: #333;
    text-decoration: none;
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    cursor: pointer;
    font-size: 1em;
  }
  #user-menu a:hover, #user-menu button:hover {
    background-color: #eee;
  }
  #video-section {
    max-width: 900px;
    margin: 30px auto;
    position: relative;
  }
  .video-placeholder {
    background-color: #ddd;
    height: 400px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2em;
    color: #888;
    border-radius: 10px;
    overflow: hidden;
  }
  #video-mask {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(5px);
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5em;
    color: #555;
    pointer-events: all;
  }
  nav form {
    display: inline;
    margin: 0;
  }
</style>
</head>
<body>

<nav>
  <a href="/login" id="login-btn"><button type="button">登入</button></a>
  <a href="/register" id="register-btn"><button type="button">註冊</button></a>

  <button id="user-menu-button" style="display:none;"></button>
  <div id="user-menu">
    <a href="/account">帳號管理</a>
    <form action="/logout" method="post" style="margin:0;">
      <button type="submit">登出</button>
    </form>
  </div>
</nav>

<section id="video-section">
  <div class="video-placeholder" id="video-container">
    影片內容區域
  </div>
  <div id="video-mask">請登入後觀看影片內容</div>
</section>

<script>
  const videoMask = document.getElementById('video-mask');
  const videoContainer = document.getElementById('video-container');
  const loginBtn = document.getElementById('login-btn');
  const registerBtn = document.getElementById('register-btn');
  const userMenuButton = document.getElementById('user-menu-button');
  const userMenu = document.getElementById('user-menu');

  // 假設登入狀態用 localStorage 簡易模擬，並且存在使用者名稱
  window.onload = () => {
    const loggedIn = localStorage.getItem('loggedIn');
    const username = localStorage.getItem('username') || '使用者';

    if (loggedIn === 'true') {
      videoMask.style.display = 'none'; // 隱藏遮罩，允許觀看影片

      // 嵌入 YouTube 影片
      const youtubeID = 'rboiHxBqdZk'; 
      videoContainer.innerHTML = `
        <iframe width="100%" height="400" 
                src="https://www.youtube.com/embed/${youtubeID}" 
                title="YouTube video player" frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen></iframe>
      `;

      // 顯示 username 並隱藏登入註冊按鈕
      loginBtn.style.display = 'none';
      registerBtn.style.display = 'none';
      userMenuButton.style.display = 'inline-block';
      userMenuButton.textContent = username;
    } else {
      videoMask.style.display = 'flex';
      loginBtn.style.display = 'inline-block';
      registerBtn.style.display = 'inline-block';
      userMenuButton.style.display = 'none';
      userMenu.style.display = 'none';
    }
  }

  // 點擊 username 按鈕時切換帳號管理選單顯示
  userMenuButton.addEventListener('click', () => {
    if (userMenu.style.display === 'block') {
      userMenu.style.display = 'none';
    } else {
      userMenu.style.display = 'block';
    }
  });

  // 點擊頁面其它地方時，收合帳號管理選單
  document.addEventListener('click', (e) => {
    if (!userMenu.contains(e.target) && e.target !== userMenuButton) {
      userMenu.style.display = 'none';
    }
  });
</script>

</body>
</html>
