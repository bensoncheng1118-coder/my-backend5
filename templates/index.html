<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>手語教學平台</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0; padding: 0;
    background-color: #f0f0f0;
  }
  nav {
    display: flex;
    justify-content: flex-end;
    background-color: #333;
    padding: 10px 20px;
  }
  nav button {
    background-color: #0066cc;
    color: white;
    border: none;
    padding: 8px 16px;
    margin-left: 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 1em;
  }
  nav button:hover {
    background-color: #004999;
  }
  #video-section {
    max-width: 900px;
    margin: 30px auto;
    position: relative;
  }
  .video-placeholder {
    background-color: #ddd;
    height: 400px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2em;
    color: #888;
    border-radius: 10px;
  }
  #video-mask {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(5px);
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5em;
    color: #555;
    pointer-events: all;
  }
  nav form {
    display: inline;
    margin: 0;
  }
</style>
</head>
<body>

<nav>
  <a href="/login"><button type="button">登入</button></a>
  <a href="/register"><button type="button">註冊</button></a>
</nav>


<section id="video-section">
  <div class="video-placeholder">
    影片內容區域
  </div>
  <div id="video-mask">請登入後觀看影片內容</div>
</section>

<script>
  const videoMask = document.getElementById('video-mask');

  // 假設登入狀態用 localStorage 簡易模擬
  window.onload = () => {
    const loggedIn = localStorage.getItem('loggedIn');
    if (loggedIn === 'true') {
      videoMask.style.display = 'none'; // 隱藏遮罩，允許觀看影片
    } else {
      videoMask.style.display = 'flex';
    }
  }
</script>

</body>
</html>
