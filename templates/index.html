<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>手語教學平台</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0; padding: 0;
    background-color: #f0f0f0;
  }
  nav {
    display: flex;
    justify-content: flex-end;
    background-color: transparent; /* 改成透明 */
    padding: 10px 20px;
    position: relative;
    align-items: center; /* 置中垂直對齊 */
  }
  nav button {
    background-color: transparent; /* 透明底 */
    color: black; /* 黑字 */
    /* border: 1.5px solid black; 改為無邊框 */
    border: none;
    padding: 8px 16px;
    margin-left: 10px;
    border-radius: 9999px; /* 超圓潤 */
    cursor: pointer;
    font-size: 1em;
    transition: all 0.3s ease;
  }
  nav button:hover {
    background-color: black; /* 滑鼠懸浮變黑底 */
    color: white; /* 字變白 */
  }
  #user-menu-button {
    background: transparent;
    color: black;
    /* border: 1.5px solid black; 改為無邊框 */
    border: none;
    font-size: 1em;
    cursor: pointer;
    margin-left: 10px;
    padding: 8px 16px;
    border-radius: 9999px; /* 超圓潤 */
    position: relative;
    transition: all 0.3s ease;
  }
  #user-menu-button:hover {
    background-color: black;
    color: white;
  }
  #user-menu {
    display: none;
    position: absolute;
    top: 45px;
    right: 20px;
    background-color: white;
    border-radius: 5px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    z-index: 20;
  }
  #user-menu a, #user-menu button {
    display: block;
    padding: 10px 20px;
    color: #333;
    text-decoration: none;
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    cursor: pointer;
    font-size: 1em;
  }
  #user-menu a:hover, #user-menu button:hover {
    background-color: #eee;
  }

  /* 漢堡選單按鈕 */
  #hamburger-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    width: 26px;
    height: 22px;
    margin-right: auto; /* 靠左 */
    border-radius: 4px;
    transition: background-color 0.3s ease;
  }
  #hamburger-btn:hover {
    background-color: rgba(0,0,0,0.1);
  }
  #hamburger-btn div {
    width: 26px;
    height: 3px;
    background-color: black;
    border-radius: 2px;
    transition: all 0.3s ease;
  }

  /* 搜尋欄 */
  #search-form {
    margin-left: 20px;
    display: flex;
    align-items: center;
  }
  #search-input {
    padding: 6px 10px;
    font-size: 1em;
    /* border: 1.5px solid black; 改為無邊框 */
    border: none;
    border-radius: 9999px 0 0 9999px; /* 左側超圓潤 */
    outline: none;
  }
  #search-btn {
    padding: 8px 14px;
    font-size: 1em;
    /* border: 1.5px solid black; border-left: none; 改為無邊框 */
    border: none;
    border-radius: 0 9999px 9999px 0; /* 右側超圓潤 */
    background-color: transparent;
    color: black;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  #search-btn:hover {
    background-color: black;
    color: white;
  }
  
  /* 滑出側邊表單 */
  #side-form {
    position: fixed;
    top: 0;
    left: -280px; /* 初始隱藏在左邊 */
    width: 280px;
    height: 100vh;
    background-color: white;
    box-shadow: 2px 0 8px rgba(0,0,0,0.3);
    z-index: 30;
    transition: left 0.35s ease;
    display: flex;
    flex-direction: column;
    padding: 20px;
  }
  #side-form.active {
    left: 0;
  }
  #side-form button, #side-form a {
    margin-bottom: 15px;
    padding: 10px 15px;
    font-size: 1em;
    text-align: left;
    color: black;
    background: #eee;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    text-decoration: none;
    user-select: none;
    transition: background-color 0.3s ease;
  }
  #side-form button:hover, #side-form a:hover {
    background-color: #ccc;
  }

.video-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr); /* 三欄 */
  gap: 20px; /* 影片間距 */
  padding: 20px;
  justify-items: center;
}

.video-item {
  width: 100%;
  max-width: 360px; /* 控制每個影片寬度 */
  background-color: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  text-align: center;
}

.video-item iframe {
  width: 100%;
  height: 200px;
  display: block;
}

.video-title {
  padding: 10px;
  font-size: 1em;
  background-color: #f9f9f9;
}

</style>
</head>
<body>

<nav>
  <button id="hamburger-btn" aria-label="開啟選單">
    <div></div>
    <div></div>
    <div></div>
  </button>

  <form id="search-form" action="/search" method="GET" role="search" >
    <input id="search-input" type="text" name="q" placeholder="搜尋影片或課程" aria-label="搜尋" required />
    <button id="search-btn" type="submit">搜尋</button>
  </form>

  <a href="/login" id="login-btn"><button type="button">登入</button></a>
  <a href="/register" id="register-btn"><button type="button">註冊</button></a>

  <button id="user-menu-button" style="display:none;"></button>
  <div id="user-menu">
    <a href="/account">帳號管理</a>
    <form action="/logout" method="post" style="margin:0;">
      <button type="submit">登出</button>
    </form>
  </div>
</nav>

<!-- 新增側邊出來表單 -->
<div id="side-form" aria-hidden="true">
  <a href="/account" tabindex="0">帳號管理頁面</a>
  <button type="button" id="favorites-btn" tabindex="0">收藏影片</button>
</div>

<section id="video-section">
  <div id="video-container" class="video-grid">
    <!-- 登入後才會顯示的影片 -->
  </div>
  <div id="video-mask">請登入後觀看影片內容</div>
</section>

<script>
  window.loggedIn = {{ loggedIn|tojson }};
  window.username = {{ username|tojson }};
</script>

<script>
  const videoMask = document.getElementById('video-mask');
  const videoContainer = document.getElementById('video-container');
  const loginBtn = document.getElementById('login-btn');
  const registerBtn = document.getElementById('register-btn');
  const userMenuButton = document.getElementById('user-menu-button');
  const userMenu = document.getElementById('user-menu');
  const hamburgerBtn = document.getElementById('hamburger-btn');
  const sideForm = document.getElementById('side-form');

  window.onload = () => {
    const loggedIn = window.loggedIn || localStorage.getItem('loggedIn') === 'true';
    const username = window.username || localStorage.getItem('username') || '使用者';

    if (loggedIn) {
      videoMask.style.display = 'none'; // 隱藏遮罩

      // ======= 嵌入 18 部 YouTube 影片 =======
      const youtubeIDs = [
        'rboiHxBqdZk', '', '', '', '', '',
        '', '', '', '', '', '',
        '', '', '', '', '', ''
      ];
      const titles = [
        '名稱1', '名稱2', '名稱3',
        '名稱4', '名稱5', '名稱6',
        '名稱7', '名稱8', '名稱9',
        '名稱10', '名稱11', '名稱12',
        '名稱13', '名稱14', '名稱15',
        '名稱16', '名稱17', '名稱18'
      ];

      videoContainer.innerHTML = youtubeIDs.map((id, i) => `
        <div class="video-item">
          ${id 
            ? `<iframe src="https://www.youtube.com/embed/${id}" 
                      frameborder="0" allow="accelerometer; autoplay; 
                      clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                      allowfullscreen></iframe>`
            : `<div style="height:200px;display:flex;justify-content:center;align-items:center;background:#ccc;">尚未設定影片</div>`
          }
          <div class="video-title">${titles[i]}</div>
        </div>
      `).join('');

      // 顯示使用者名稱
      loginBtn.style.display = 'none';
      registerBtn.style.display = 'none';
      userMenuButton.style.display = 'inline-block';
      userMenuButton.textContent = username;
    } else {
      videoContainer.style.display = 'none';
      videoMask.style.display = 'flex';
      loginBtn.style.display = 'inline-block';
      registerBtn.style.display = 'inline-block';
      userMenuButton.style.display = 'none';
      userMenu.style.display = 'none';
    }
  }

  userMenuButton.addEventListener('click', () => {
    userMenu.style.display = (userMenu.style.display === 'block') ? 'none' : 'block';
  });

  document.addEventListener('click', (e) => {
    if (!userMenu.contains(e.target) && e.target !== userMenuButton) {
      userMenu.style.display = 'none';
    }
    if (!sideForm.contains(e.target) && e.target !== hamburgerBtn) {
      sideForm.classList.remove('active');
      sideForm.setAttribute('aria-hidden', 'true');
    }
  });

  hamburgerBtn.addEventListener('click', () => {
    const isActive = sideForm.classList.toggle('active');
    sideForm.setAttribute('aria-hidden', !isActive);
  });

  // 收藏影片按鈕點擊事件（可自行補充）
  const favoritesBtn = document.getElementById('favorites-btn');
  favoritesBtn.addEventListener('click', () => {
    alert('這裡可以實作收藏影片的功能');
  });
</script>

</body>
</html>
