<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>手語教學平台</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0; padding: 0;
    background-color: #f0f0f0;
  }
  nav {
    display: flex;
    justify-content: flex-end;
    background-color: #333;
    padding: 10px 20px;
  }
  nav button {
    background-color: #0066cc;
    color: white;
    border: none;
    padding: 8px 16px;
    margin-left: 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 1em;
  }
  nav button:hover {
    background-color: #004999;
  }
  #video-section {
    max-width: 900px;
    margin: 30px auto;
    position: relative;
  }
  .video-placeholder {
    background-color: #ddd;
    height: 400px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2em;
    color: #888;
    border-radius: 10px;
  }
  #video-mask {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(5px);
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5em;
    color: #555;
    pointer-events: all;
  }
</style>
</head>
<body>

<nav>
  <button id="loginBtn">登入</button>
  <button id="registerBtn">註冊</button>
</nav>

<section id="video-section">
  <div class="video-placeholder">
    影片內容區域
  </div>
  <div id="video-mask">請登入後觀看影片內容</div>
</section>

<script>
  const loginBtn = document.getElementById('loginBtn');
  const registerBtn = document.getElementById('registerBtn');
  const videoMask = document.getElementById('video-mask');

  const API_BASE = 'https://sign-language-1118.onrender.com/api';

  // 登入
  loginBtn.addEventListener('click', async () => {
    const username = prompt("請輸入帳號:");
    const password = prompt("請輸入密碼:");
    if (!username || !password) return;

    try {
      const res = await fetch(`${API_BASE}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
        credentials: 'include'
      });
      const data = await res.json();
      alert(data.message || data.error);
      if (res.ok) {
        localStorage.setItem('loggedIn', 'true');
        videoMask.style.display = 'none';
      }
    } catch (err) {
      console.error(err);
      alert('登入失敗，請稍後再試');
    }
  });

  // 註冊
  registerBtn.addEventListener('click', async () => {
    const username = prompt("請輸入帳號:");
    const email = prompt("請輸入Email:");
    const password = prompt("請輸入密碼:");
    if (!username || !email || !password) return;

    try {
      const res = await fetch(`${API_BASE}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password }),
        credentials: 'include'
      });
      const data = await res.json();
      alert(data.message || data.error);
    } catch (err) {
      console.error(err);
      alert('註冊失敗，請稍後再試');
    }
  });

  // 檢查登入狀態
  window.onload = async () => {
    try {
      const res = await fetch(`${API_BASE}/status`, {
        method: 'GET',
        credentials: 'include'
      });
      const data = await res.json();
      if (data.logged_in) {
        localStorage.setItem('loggedIn', 'true');
        videoMask.style.display = 'none';
      } else {
        localStorage.setItem('loggedIn', 'false');
        videoMask.style.display = 'flex';
      }
    } catch (err) {
      console.error(err);
      videoMask.style.display = 'flex';
    }
  }
</script>

</body>
</html>
