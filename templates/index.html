<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>手語教學平台</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0; padding: 0;
    background-color: #f0f0f0;
  }
  nav {
    display: flex;
    justify-content: flex-end;
    background-color: #333;
    padding: 10px 20px;
    position: relative;
  }
  nav button {
    background-color: #0066cc;
    color: white;
    border: none;
    padding: 8px 16px;
    margin-left: 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 1em;
  }
  nav button:hover {
    background-color: #004999;
  }
  #user-menu-button {
    background: none;
    color: white;
    border: none;
    font-size: 1em;
    cursor: pointer;
    margin-left: 10px;
    padding: 8px 16px;
    border-radius: 5px;
    position: relative;
  }
  #user-menu-button:hover {
    background-color: #004999;
  }
  #user-menu {
    display: none;
    position: absolute;
    top: 45px;
    right: 20px;
    background-color: white;
    border-radius: 5px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    z-index: 10;
  }
  #user-menu a, #user-menu button {
    display: block;
    padding: 10px 20px;
    color: #333;
    text-decoration: none;
    background: none;
    border: none;
    width: 100%;
    text-align: left;
    cursor: pointer;
    font-size: 1em;
  }
  #user-menu a:hover, #user-menu button:hover {
    background-color: #eee;
  }

  /* ===== 新增：影片排版 ===== */
  #video-section {
    max-width: 1200px;
    margin: 30px auto;
    position: relative;
  }
  .video-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  .video-item {
    background-color: #ddd;
    border-radius: 10px;
    overflow: hidden;
    text-align: center;
    font-size: 1em;
    color: #333;
  }
  .video-item iframe {
    width: 100%;
    height: 200px;
  }
  .video-title {
    padding: 10px;
    background-color: #fff;
  }

  #video-mask {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(5px);
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5em;
    color: #555;
    pointer-events: all;
  }
  nav form {
    display: inline;
    margin: 0;
  }
</style>
</head>
<body>

<nav>
  <a href="/login" id="login-btn"><button type="button">登入</button></a>
  <a href="/register" id="register-btn"><button type="button">註冊</button></a>

  <button id="user-menu-button" style="display:none;"></button>
  <div id="user-menu">
    <a href="/account">帳號管理</a>
    <form action="/logout" method="post" style="margin:0;">
      <button type="submit">登出</button>
    </form>
  </div>
</nav>

<section id="video-section">
  <div id="video-container" class="video-grid">
    <!-- 登入後才會顯示的影片 -->
  </div>
  <div id="video-mask">請登入後觀看影片內容</div>
</section>

<script>
  window.loggedIn = {{ loggedIn|tojson }};
  window.username = {{ username|tojson }};
</script>

<script>
  const videoMask = document.getElementById('video-mask');
  const videoContainer = document.getElementById('video-container');
  const loginBtn = document.getElementById('login-btn');
  const registerBtn = document.getElementById('register-btn');
  const userMenuButton = document.getElementById('user-menu-button');
  const userMenu = document.getElementById('user-menu');

  window.onload = () => {
    const loggedIn = window.loggedIn || localStorage.getItem('loggedIn') === 'true';
    const username = window.username || localStorage.getItem('username') || '使用者';

    if (loggedIn) {
      videoMask.style.display = 'none'; // 隱藏遮罩

      // ======= 嵌入 18 部 YouTube 影片 =======
      const youtubeIDs = [
        'rboiHxBqdZk', '', '', '', '', '',
        '', '', '', '', '', '',
        '', '', '', '', '', ''
      ];
      const titles = [
        '名稱1', '名稱2', '名稱3',
        '名稱4', '名稱5', '名稱6',
        '名稱7', '名稱8', '名稱9',
        '名稱10', '名稱11', '名稱12',
        '名稱13', '名稱14', '名稱15',
        '名稱16', '名稱17', '名稱18'
      ];

      videoContainer.innerHTML = youtubeIDs.map((id, i) => `
        <div class="video-item">
          ${id 
            ? `<iframe src="https://www.youtube.com/embed/${id}" 
                      frameborder="0" allow="accelerometer; autoplay; 
                      clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                      allowfullscreen></iframe>`
            : `<div style="height:200px;display:flex;justify-content:center;align-items:center;background:#ccc;">尚未設定影片</div>`
          }
          <div class="video-title">${titles[i]}</div>
        </div>
      `).join('');

      // 顯示使用者名稱
      loginBtn.style.display = 'none';
      registerBtn.style.display = 'none';
      userMenuButton.style.display = 'inline-block';
      userMenuButton.textContent = username;
    } else {
      videoContainer.style.display = 'none';
      videoMask.style.display = 'flex';
      loginBtn.style.display = 'inline-block';
      registerBtn.style.display = 'inline-block';
      userMenuButton.style.display = 'none';
      userMenu.style.display = 'none';
    }
  }

  userMenuButton.addEventListener('click', () => {
    userMenu.style.display = (userMenu.style.display === 'block') ? 'none' : 'block';
  });

  document.addEventListener('click', (e) => {
    if (!userMenu.contains(e.target) && e.target !== userMenuButton) {
      userMenu.style.display = 'none';
    }
  });
</script>

</body>
</html>
